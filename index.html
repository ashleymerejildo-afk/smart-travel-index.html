<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Travel — Plan your trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================================================
     SPLASH SCREEN
============================================================ -->
<div class="screen active" id="splash">
  <div class="illo-wrap">
    <svg width="180" height="180" viewBox="0 0 180 180" fill="none">
      <g class="sunburst">
        <circle cx="90" cy="90" r="34" fill="#E0A83F"/>
        <g stroke="#C9603E" stroke-width="4" stroke-linecap="round">
          <line x1="90" y1="20" x2="90" y2="38"/>
          <line x1="90" y1="142" x2="90" y2="160"/>
          <line x1="20" y1="90" x2="38" y2="90"/>
          <line x1="142" y1="90" x2="160" y2="90"/>
          <line x1="38" y1="38" x2="50" y2="50"/>
          <line x1="130" y1="130" x2="142" y2="142"/>
          <line x1="142" y1="38" x2="130" y2="50"/>
          <line x1="50" y1="130" x2="38" y2="142"/>
        </g>
      </g>
      <path d="M90 90 q14 -14 0 -28 q-14 14 0 28" stroke="#74906A" stroke-width="0" fill="#74906A" opacity="0.9"/>
      <path d="M40 150 q20 -30 0 -55" stroke="#74906A" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M40 150 q-14 -10 -20 -28" stroke="#74906A" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M40 150 q22 -6 26 -24" stroke="#74906A" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="145" cy="140" r="7" fill="#C9603E"/>
      <circle cx="152" cy="152" r="5" fill="#E0A83F"/>
      <circle cx="132" cy="152" r="5" fill="#74906A"/>
    </svg>
  </div>
  <h1>Smart Travel</h1>
  <p>Plan your trip</p>
</div>

<!-- ============================================================
     SETUP SCREEN — Destination / Arrival / Departure / Transport
============================================================ -->
<div class="screen" id="setup">
  <div class="banner setup-banner">
    <svg width="100%" height="180" viewBox="0 0 480 180" preserveAspectRatio="xMidYMid slice">
      <g class="sunburst" style="transform-origin:80px 70px;">
        <circle cx="80" cy="70" r="30" fill="#E0A83F"/>
        <g stroke="#C9603E" stroke-width="3.5" stroke-linecap="round">
          <line x1="80" y1="14" x2="80" y2="28"/>
          <line x1="80" y1="112" x2="80" y2="126"/>
          <line x1="24" y1="70" x2="38" y2="70"/>
          <line x1="122" y1="70" x2="136" y2="70"/>
          <line x1="40" y1="30" x2="50" y2="40"/>
          <line x1="110" y1="100" x2="120" y2="110"/>
          <line x1="120" y1="30" x2="110" y2="40"/>
          <line x1="50" y1="100" x2="40" y2="110"/>
        </g>
      </g>
      <path d="M400 160 q18 -34 0 -62" stroke="#74906A" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M400 160 q-16 -12 -22 -32" stroke="#74906A" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M400 160 q24 -8 28 -28" stroke="#74906A" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="330" cy="60" r="9" fill="#C9603E"/>
      <circle cx="340" cy="45" r="6" fill="#E0A83F"/>
      <circle cx="318" cy="46" r="6" fill="#74906A"/>
      <path d="M200 150 q30 -20 -8 -46 q30 20 8 46" fill="#E7D5BC" opacity="0.7"/>
      <circle cx="440" cy="130" r="5" fill="#E0A83F" opacity="0.8"/>
      <circle cx="30" cy="140" r="4" fill="#74906A" opacity="0.7"/>
    </svg>
  </div>

  <div class="setup-body">
    <div class="brand-title">
      <h1>Smart Travel</h1>
    </div>

    <label class="field-label first" for="destinationInput">Destination</label>
    <input class="destination-input" id="destinationInput" type="text" placeholder="Where are you going? E.g. Madrid, Spain" autocomplete="off" />

    <label class="field-label" id="routeLabel">Route</label>
    <div class="route-row" role="group" aria-labelledby="routeLabel">
      <div class="route-field departure">
        <label for="departureInput">Departure</label>
        <input id="departureInput" type="text" placeholder="Origin city" autocomplete="off" />
      </div>
      <button class="route-swap" id="swapBtn" title="Swap" aria-label="Swap departure and arrival" type="button">⇄</button>
      <div class="route-field">
        <label for="arrivalInput">Arrival</label>
        <input id="arrivalInput" type="text" placeholder="Destination city" autocomplete="off" />
      </div>
    </div>

    <label class="field-label" id="transportLabel">Transport</label>
    <div class="transport-list" id="transportList" role="radiogroup" aria-labelledby="transportLabel">
      <div class="transport-opt" data-t="bus" role="radio" aria-checked="false" tabindex="0"><span class="icon" aria-hidden="true">🚌</span><span class="label">Bus</span></div>
      <div class="transport-opt" data-t="train" role="radio" aria-checked="false" tabindex="0"><span class="icon" aria-hidden="true">🚆</span><span class="label">Train</span></div>
      <div class="transport-opt" data-t="metro" role="radio" aria-checked="false" tabindex="0"><span class="icon" aria-hidden="true">🚇</span><span class="label">Metro</span></div>
      <div class="transport-opt" data-t="plane" role="radio" aria-checked="false" tabindex="0"><span class="icon" aria-hidden="true">✈️</span><span class="label">Plane</span></div>
      <div class="transport-opt" data-t="taxi" role="radio" aria-checked="false" tabindex="0"><span class="icon" aria-hidden="true">🚕</span><span class="label">Taxi / Uber</span></div>
      <div class="transport-opt" data-t="walk" role="radio" aria-checked="false" tabindex="0"><span class="icon" aria-hidden="true">🚶</span><span class="label">Walk</span></div>
    </div>
  </div>

  <div class="cta-bar">
    <button class="start-btn" id="startTripBtn" disabled>Start Trip</button>
    <div class="hint-text" id="hintText" aria-live="polite">Enter your destination to get started</div>
  </div>
</div>

<!-- ============================================================
     RESULTS SCREEN — map with nearby hotels/transit/safe/toilets
============================================================ -->
<div class="screen" id="results">
  <div class="results-layout">
    <aside class="results-panel">
      <div class="results-top">
        <button class="back-btn" id="backBtn" aria-label="Back to trip setup">←</button>
        <div>
          <h2 id="resultsTitle">Your trip</h2>
          <p id="resultsSubtitle">—</p>
        </div>
      </div>

      <div class="status-line" aria-live="polite">
        <span class="pulse-dot off" id="statusDot"></span>
        <span id="statusText">Preparing results…</span>
      </div>

      <div class="chips" id="chips" role="group" aria-label="Filter by category">
        <div class="chip active" data-cat="hotel" role="button" tabindex="0" aria-pressed="true"><span class="dot" style="background:var(--gold)"></span>Lodging <span class="count" id="count-hotel">0</span></div>
        <div class="chip active" data-cat="transit" role="button" tabindex="0" aria-pressed="true"><span class="dot" style="background:var(--sage)"></span>Transportation <span class="count" id="count-transit">0</span></div>
        <div class="chip active" data-cat="safe" role="button" tabindex="0" aria-pressed="true"><span class="dot" style="background:var(--terracotta)"></span>Safe stations <span class="count" id="count-safe">0</span></div>
        <div class="chip active" data-cat="toilet" role="button" tabindex="0" aria-pressed="true"><span class="dot" style="background:var(--dusk)"></span>Restrooms <span class="count" id="count-toilet">0</span></div>
      </div>

      <div class="board-head">
        <h3>Nearby</h3>
        <span id="resultMeta">—</span>
      </div>
      <div class="board" id="board">
        <div class="empty-state">Loading…</div>
      </div>
    </aside>

    <div style="position:relative;">
      <div id="resultsMap"></div>
      <div class="detail-card" id="detailCard" role="dialog" aria-labelledby="detailName">
        <button class="close" id="closeDetail" aria-label="Close detail">✕</button>
        <div class="cat-tag" id="detailTag">—</div>
        <h3 id="detailName">—</h3>
        <p id="detailMeta">—</p>
        <button class="btn-primary" id="directionsBtn">Get directions</button>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="navigation.js"></script>
<script src="map.js"></script>
<script src="setup.js"></script>
</body>
</html>
