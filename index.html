<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Travel — Plan your trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Leaflet + OpenStreetMap -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============================================================
     SPLASH SCREEN
============================================================ -->
<div class="screen active" id="splash">
  <div class="sun-glow"></div>
  <svg class="badge-svg" viewBox="0 0 240 240" fill="none">
    <defs>
      <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FFD873"/>
        <stop offset="1" stop-color="#8FD1F0"/>
      </linearGradient>
      <linearGradient id="trailGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#8FD1F0" stop-opacity="0.15"/>
        <stop offset="1" stop-color="#EAF7FF" stop-opacity="0.95"/>
      </linearGradient>
    </defs>
    <circle cx="120" cy="120" r="100" fill="#FFFFFF" fill-opacity="0.1"/>
    <circle id="badgeRing" cx="120" cy="120" r="100" stroke="url(#ringGrad)" stroke-width="6" fill="none"/>

    <circle id="eyeL" cx="92" cy="92" r="7" fill="#1F5FA6"/>
    <circle id="eyeR" cx="132" cy="86" r="7" fill="#1F5FA6"/>

    <!-- blue trail left behind the plane as it draws the smile -->
    <path id="planeTrail" d="M68,112 Q118,176 172,112" stroke="url(#trailGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>

    <path id="smileArc" d="M68,112 Q118,176 172,112" stroke="#FFC94A" stroke-width="16" stroke-linecap="round" fill="none"/>

    <g id="planeGroup">
      <g transform="translate(-14,-7) scale(1.15)">
        <path d="M2 8 L22 8 L32 3 L34 4.5 L27 8.6 L34 12.7 L32 14.2 L22 9.5 L2 9.5 Z" fill="#1F5FA6"/>
        <path d="M10 6.5 L6 1 L9 1 L14 6.5 Z" fill="#1F5FA6"/>
        <path d="M10 11 L6 16.5 L9 16.5 L14 11 Z" fill="#1F5FA6"/>
      </g>
      <animateMotion dur="0.8s" begin="0.75s" fill="freeze" rotate="auto" path="M68,112 Q118,176 172,112" calcMode="spline" keySplines="0.4 0.1 0.3 1" keyTimes="0;1"/>
    </g>
  </svg>
  <div class="splash-logo">
    <h1>Smart Travel</h1>
    <p>Plan your trip</p>
  </div>
</div>

<!-- ============================================================
     SETUP SCREEN — Destination / Arrival / Departure / Transport
============================================================ -->
<div class="screen" id="setup">
  <div class="banner setup-banner">
    <svg viewBox="0 0 480 236" preserveAspectRatio="xMidYMax slice">
      <defs>
        <radialGradient id="sunGradSetup" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFF7DE"/>
          <stop offset="45%" stop-color="#FFD873"/>
          <stop offset="100%" stop-color="#FFD873" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="worldShade" cx="38%" cy="32%" r="75%">
          <stop offset="0%" stop-color="#6FBEEA"/>
          <stop offset="60%" stop-color="var(--world-sea)"/>
          <stop offset="100%" stop-color="#2E6FA0"/>
        </radialGradient>
      </defs>

      <!-- distant sun, top corner -->
      <circle cx="424" cy="30" r="46" fill="url(#sunGradSetup)"/>
      <circle cx="424" cy="30" r="18" fill="#FFEFB0"/>

      <!-- soft clouds -->
      <g fill="#FFFFFF" opacity="0.85">
        <ellipse cx="54" cy="26" rx="26" ry="10"/>
        <ellipse cx="74" cy="20" rx="18" ry="9"/>
        <ellipse cx="34" cy="20" rx="15" ry="8"/>
      </g>
      <g fill="#FFFFFF" opacity="0.7">
        <ellipse cx="300" cy="16" rx="22" ry="8"/>
        <ellipse cx="316" cy="22" rx="15" ry="7"/>
      </g>
      <g fill="#FFFFFF" opacity="0.6">
        <ellipse cx="150" cy="40" rx="20" ry="7"/>
        <ellipse cx="164" cy="35" rx="13" ry="6"/>
      </g>

      <!-- tiny birds -->
      <path d="M200,18 q5,-6 10,0 q5,-6 10,0" stroke="rgba(255,255,255,0.75)" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- sky planes with dashed trails -->
      <path class="plane-trail" d="M12,52 L92,30" stroke="rgba(255,255,255,0.6)" stroke-width="2" fill="none"/>
      <g transform="translate(98,28) rotate(-14) scale(0.55)">
        <path d="M2 8 L22 8 L32 3 L34 4.5 L27 8.6 L34 12.7 L32 14.2 L22 9.5 L2 9.5 Z" fill="#FFFFFF"/>
      </g>
      <path class="plane-trail" d="M356,64 L420,46" stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none"/>
      <g transform="translate(426,44) rotate(-14) scale(0.42)">
        <path d="M2 8 L22 8 L32 3 L34 4.5 L27 8.6 L34 12.7 L32 14.2 L22 9.5 L2 9.5 Z" fill="#FFFFFF"/>
      </g>

      <!-- 7 iconic monuments along the horizon -->
      <!-- Eiffel Tower (France) -->
      <g transform="translate(12,0)">
        <path d="M28 55 L34 90 L40 120 L46 120 L40 90 L32 55 Z" fill="var(--monument-ink)"/>
        <path d="M18 120 L26 90 L32 55 L30 90 L22 120 Z" fill="var(--monument-ink)"/>
        <rect x="20" y="98" width="20" height="4" fill="var(--monument-ink)"/>
        <rect x="14" y="116" width="32" height="5" fill="var(--monument-ink)"/>
      </g>

      <!-- Statue of Liberty (USA) -->
      <g transform="translate(76,0)">
        <rect x="8" y="96" width="18" height="24" fill="var(--monument-ink)"/>
        <path d="M6 96 Q17 68 28 96 Z" fill="var(--monument-ink)"/>
        <rect x="14" y="70" width="5" height="27" fill="var(--monument-ink)"/>
        <path d="M12 70 L20 70 L16 58 Z" fill="var(--gold)"/>
        <path d="M2 64 L8 54 L11 55 L7 65 Z" fill="var(--monument-ink)"/>
      </g>

      <!-- Pyramids of Giza (Egypt) -->
      <g transform="translate(142,0)">
        <path d="M0 120 L20 78 L40 120 Z" fill="#D9A85C"/>
        <path d="M22 120 L40 90 L58 120 Z" fill="#C99248"/>
        <path d="M44 120 L56 98 L68 120 Z" fill="#B9813A"/>
      </g>

      <!-- Taj Mahal (India) -->
      <g transform="translate(212,0)">
        <rect x="10" y="95" width="34" height="25" fill="#EFE7DD"/>
        <path d="M10 95 Q27 60 44 95 Z" fill="#F4EEE3"/>
        <circle cx="27" cy="60" r="3" fill="var(--gold)"/>
        <rect x="1" y="80" width="6" height="40" fill="#EFE7DD"/>
        <rect x="47" y="80" width="6" height="40" fill="#EFE7DD"/>
        <path d="M1 80 Q4 70 7 80 Z" fill="#EFE7DD"/>
        <path d="M47 80 Q50 70 53 80 Z" fill="#EFE7DD"/>
      </g>

      <!-- Sydney Opera House (Australia) -->
      <g transform="translate(278,0)">
        <rect x="-4" y="114" width="66" height="6" fill="#D8CFC0"/>
        <path d="M0 114 Q10 82 24 114 Z" fill="#F4EFE6"/>
        <path d="M16 114 Q28 76 42 114 Z" fill="#EAE3D6"/>
        <path d="M34 114 Q46 86 58 114 Z" fill="#F4EFE6"/>
      </g>

      <!-- Roman Colosseum (Italy) -->
      <g transform="translate(344,0)">
        <path d="M0 120 Q0 80 30 80 Q60 80 60 120 Z" fill="var(--monument-ink)"/>
        <rect x="4" y="88" width="6" height="10" fill="var(--sky-mid)"/>
        <rect x="16" y="88" width="6" height="10" fill="var(--sky-mid)"/>
        <rect x="28" y="88" width="6" height="10" fill="var(--sky-mid)"/>
        <rect x="40" y="88" width="6" height="10" fill="var(--sky-mid)"/>
        <rect x="52" y="88" width="6" height="10" fill="var(--sky-mid)"/>
      </g>

      <!-- Blue Mosque (Turkey) -->
      <g transform="translate(404,0)">
        <path d="M8 120 Q8 96 26 96 Q44 96 44 120 Z" fill="var(--dusk)"/>
        <circle cx="26" cy="89" r="10" fill="var(--dusk)"/>
        <rect x="0" y="72" width="5" height="48" fill="var(--dusk)"/>
        <rect x="47" y="72" width="5" height="48" fill="var(--dusk)"/>
        <path d="M0 72 Q2.5 64 5 72 Z" fill="var(--dusk)"/>
        <path d="M47 72 Q49.5 64 52 72 Z" fill="var(--dusk)"/>
        <path d="M24 80 L26 73 L28 80 Z" fill="var(--gold)"/>
      </g>

      <!-- flat-design world, sitting just below the horizon -->
      <circle cx="240" cy="300" r="185" fill="url(#worldShade)" stroke="#EFF7FB" stroke-width="3"/>
      <path d="M130,165 q22,-16 46,-4 q20,9 8,24 q-16,11 -38,2 q-20,-9 -16,-22 Z" fill="var(--world-land)" opacity="0.92"/>
      <path d="M258,142 q28,-9 46,7 q11,11 -7,20 q-24,9 -42,-4 q-13,-11 3,-23 Z" fill="var(--world-land)" opacity="0.92"/>
      <path d="M198,188 q32,-7 50,10 q7,11 -10,15 q-28,5 -44,-8 q-9,-9 4,-17 Z" fill="var(--world-land)" opacity="0.85"/>
      <path d="M60,190 Q240,150 420,190" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" fill="none"/>
      <path d="M90,225 Q240,195 390,225" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none"/>
    </svg>
    <h1 class="banner-title">Smart Travel</h1>
  </div>

  <div class="setup-body">
    <label class="field-label first">Destination</label>
    <input class="destination-input" id="destinationInput" type="text" placeholder="Where are you headed? E.g. Madrid, Spain" />

    <label class="field-label">Route</label>
    <div class="route-row">
      <div class="route-field departure">
        <label>Departure date</label>
        <input id="departureInput" type="date" />
      </div>
      <button class="route-swap" id="swapBtn" title="Swap dates" type="button">⇄</button>
      <div class="route-field">
        <label>Arrival date</label>
        <input id="arrivalInput" type="date" />
      </div>
    </div>

    <label class="field-label">Transportation</label>
    <div class="transport-list" id="transportList">
      <div class="transport-opt" data-t="bus"><span class="icon">🚌</span><span class="label">Bus</span></div>
      <div class="transport-opt" data-t="train"><span class="icon">🚆</span><span class="label">Train</span></div>
      <div class="transport-opt" data-t="metro"><span class="icon">🚇</span><span class="label">Metro</span></div>
      <div class="transport-opt" data-t="plane"><span class="icon">✈️</span><span class="label">Plane</span></div>
      <div class="transport-opt" data-t="taxi"><span class="icon">🚕</span><span class="label">Taxi / Uber</span></div>
      <div class="transport-opt" data-t="walk"><span class="icon">🚶</span><span class="label">Walk</span></div>
    </div>
  </div>

  <div class="cta-bar">
    <button class="start-btn" id="startTripBtn" disabled>Start Trip</button>
    <div class="hint-text">Enter your destination to get started</div>
  </div>
</div>

<!-- ============================================================
     RESULTS SCREEN — map with nearby hotels/transit/safe/toilets
============================================================ -->
<div class="screen" id="results">
  <div class="results-layout">
    <aside class="results-panel">
      <div class="results-top">
        <button class="back-btn" id="backBtn">←</button>
        <div>
          <h2 id="resultsTitle">Your trip</h2>
          <p id="resultsSubtitle">—</p>
        </div>
      </div>

      <div class="status-line">
        <span class="pulse-dot off" id="statusDot"></span>
        <span id="statusText">Preparing results…</span>
      </div>

      <div class="chips" id="chips">
        <div class="chip active" data-cat="hotel"><span class="dot" style="background:var(--gold)"></span>Lodging <span class="count" id="count-hotel">0</span></div>
        <div class="chip active" data-cat="transit"><span class="dot" style="background:var(--sage)"></span>Transportation <span class="count" id="count-transit">0</span></div>
        <div class="chip active" data-cat="safe"><span class="dot" style="background:var(--terracotta)"></span>Safe stations <span class="count" id="count-safe">0</span></div>
        <div class="chip active" data-cat="toilet"><span class="dot" style="background:var(--dusk)"></span>Restrooms <span class="count" id="count-toilet">0</span></div>
      </div>

      <div class="board-head">
        <h3>Nearest places</h3>
        <span id="resultMeta">—</span>
      </div>
      <div class="board" id="board">
        <div class="empty-state">Loading…</div>
      </div>
    </aside>

    <div style="position:relative;">
      <div id="resultsMap"></div>
      <div class="detail-card" id="detailCard">
        <button class="close" id="closeDetail">✕</button>
        <div class="cat-tag" id="detailTag">—</div>
        <h3 id="detailName">—</h3>
        <p id="detailMeta">—</p>
        <button class="btn-primary" id="directionsBtn">Get directions</button>
      </div>
    </div>
  </div>
</div>

<script src="js/navigation.js"></script>
<script src="js/setup.js"></script>
<script src="js/map.js"></script>
</body>
</html>
