<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Travel — Plan your trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --cream: #FBF3E6;
    --cream-2: #F5E6D3;
    --card: #FFFDF8;
    --ink: #2B2621;
    --ink-dim: #8A7C6C;
    --line: #E7D5BC;
    --terracotta: #C9603E;
    --sage: #74906A;
    --gold: #E0A83F;
    --dusk: #4F6672;
    --radius: 18px;

    /* dark map-screen palette (reused for results) */
    --map-ink: #0E1C24;
    --map-panel: #142A34;
    --map-panel-2: #1B3742;
    --map-line: #274552;
    --map-text: #F4EFE6;
    --map-text-dim: #93AEB6;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    overflow:hidden;
  }
  h1,h2,h3{ font-family:'Fraunces', serif; }
  ::selection{ background:var(--gold); color:#2B2621; }
  button{ font-family:'Inter', sans-serif; }

  .screen{
    position:fixed; inset:0;
    display:none;
  }
  .screen.active{ display:flex; }

  /* =========================================================
     SPLASH SCREEN
  ========================================================= */
  #splash{
    background: linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
    flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:18px;
    cursor:pointer;
    animation: fadeOut .5s ease 2.4s forwards;
  }
  #splash .illo-wrap{
    animation: floatIn 1s cubic-bezier(.2,.8,.2,1) both;
  }
  #splash h1{
    font-size:34px; font-weight:600; margin:0; letter-spacing:-0.01em;
    color:var(--ink);
    animation: floatIn 1s cubic-bezier(.2,.8,.2,1) .15s both;
  }
  #splash p{
    margin:0; color:var(--ink-dim); font-size:13.5px; letter-spacing:0.08em; text-transform:uppercase;
    animation: floatIn 1s cubic-bezier(.2,.8,.2,1) .3s both;
  }
  @keyframes floatIn{ from{ opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fadeOut{ to { opacity:0; visibility:hidden; pointer-events:none; } }
  @media (prefers-reduced-motion: reduce){
    #splash, #splash *{ animation:none !important; }
  }

  /* =========================================================
     SHARED: illustrated banner (sun / spiral / leaves / flowers)
  ========================================================= */
  .banner{
    position:relative;
    background: linear-gradient(180deg, var(--cream-2), var(--cream));
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    flex-shrink:0;
  }
  .banner svg{ display:block; }
  .sunburst{ transform-origin: 50% 50%; animation: spin 60s linear infinite; }
  @media (prefers-reduced-motion: reduce){ .sunburst{ animation:none; } }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* =========================================================
     SETUP SCREEN (trip form)
  ========================================================= */
  #setup{
    flex-direction:column;
    max-width:480px; margin:0 auto; left:0; right:0;
    background:var(--cream);
  }
  .setup-banner{ height:180px; }
  .setup-body{
    flex:1; overflow-y:auto;
    padding: 22px 24px 100px 24px;
  }
  .brand-title{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin: -46px 0 20px 0; position:relative; z-index:2;
  }
  .brand-title h1{ font-size:24px; font-weight:600; margin:0; }

  .field-label{
    font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.07em;
    color:var(--ink-dim); margin: 22px 0 8px 0; display:block;
  }
  .field-label.first{ margin-top:0; }

  .destination-input{
    width:100%;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    font-size:15px;
    color:var(--ink);
    outline:none;
    font-family:'Inter', sans-serif;
  }
  .destination-input:focus{ border-color:var(--terracotta); }
  .destination-input::placeholder{ color:var(--ink-dim); }

  .route-row{
    display:grid; grid-template-columns: 1fr auto 1fr;
    align-items:center; gap:10px;
  }
  .route-field{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
  }
  .route-field label{
    display:block; font-size:10.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.06em; color:var(--sage); margin-bottom:4px;
  }
  .route-field.departure label{ color:var(--terracotta); }
  .route-field input{
    border:none; outline:none; background:transparent; width:100%;
    font-size:14px; color:var(--ink); font-family:'Inter', sans-serif; padding:0;
  }
  .route-swap{
    width:38px; height:38px; border-radius:50%;
    background:var(--gold); border:none; color:#2B2621; font-size:16px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    transition: transform .2s ease;
  }
  .route-swap:active{ transform: rotate(180deg); }

  .transport-list{
    display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-top:6px;
  }
  .transport-opt{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:14px 8px 12px 8px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    cursor:pointer;
    transition: all .15s ease;
  }
  .transport-opt .icon{ font-size:22px; }
  .transport-opt .label{ font-size:11.5px; font-weight:600; color:var(--ink-dim); }
  .transport-opt.selected{
    border-color: var(--terracotta);
    background: #FBE9DE;
  }
  .transport-opt.selected .label{ color:var(--terracotta); }

  .cta-bar{
    position:absolute; bottom:0; left:0; right:0;
    padding:16px 24px 22px 24px;
    background: linear-gradient(180deg, rgba(251,243,230,0) 0%, var(--cream) 30%);
  }
  .start-btn{
    width:100%; border:none; border-radius:16px;
    background: var(--terracotta); color:#FFF9F2;
    font-size:16px; font-weight:600; letter-spacing:0.01em;
    padding:16px 0;
    cursor:pointer;
    box-shadow: 0 10px 24px rgba(201,96,62,0.28);
    transition: transform .12s ease;
  }
  .start-btn:active{ transform: scale(0.98); }
  .start-btn:disabled{ opacity:0.5; cursor:not-allowed; box-shadow:none; }
  .hint-text{
    text-align:center; font-size:11.5px; color:var(--ink-dim); margin-top:10px;
  }

  /* =========================================================
     RESULTS SCREEN (map) — dark, wayfinding aesthetic
  ========================================================= */
  #results{
    background:var(--map-ink); color:var(--map-text);
  }
  .results-layout{ display:grid; grid-template-columns: 380px 1fr; width:100%; height:100%; }
  @media (max-width: 860px){
    .results-layout{ grid-template-columns:1fr; grid-template-rows:auto 1fr; }
    #resultsMap{ order:2; height:42vh; }
    .results-panel{ order:1; height:58vh; }
  }
  .results-panel{
    background:var(--map-panel); border-right:1px solid var(--map-line);
    display:flex; flex-direction:column; min-height:0;
  }
  .results-top{
    padding:18px 20px 12px 20px; border-bottom:1px solid var(--map-line);
    display:flex; align-items:center; gap:10px;
  }
  .back-btn{
    background:var(--map-panel-2); border:1px solid var(--map-line); color:var(--map-text);
    border-radius:10px; width:36px; height:36px; cursor:pointer; font-size:15px; flex-shrink:0;
  }
  .results-top h2{ font-family:'Fraunces', serif; font-size:16px; margin:0; font-weight:600; }
  .results-top p{ margin:2px 0 0 0; font-size:11.5px; color:var(--map-text-dim); font-family:'IBM Plex Mono', monospace; }

  .status-line{
    padding:12px 20px; font-family:'IBM Plex Mono', monospace; font-size:11.5px;
    color:var(--map-text-dim); display:flex; align-items:center; gap:8px;
    border-bottom:1px solid var(--map-line);
  }
  .pulse-dot{ width:8px; height:8px; border-radius:50%; background:var(--sage);
    box-shadow: 0 0 0 0 rgba(116,144,106,0.6); animation:pulse 1.8s infinite; flex-shrink:0; }
  .pulse-dot.off{ background:var(--map-text-dim); animation:none; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(116,144,106,.55);} 70%{box-shadow:0 0 0 8px rgba(116,144,106,0);} 100%{box-shadow:0 0 0 0 rgba(116,144,106,0);} }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; padding:14px 20px; border-bottom:1px solid var(--map-line); }
  .chip{ display:flex; align-items:center; gap:7px; padding:8px 12px; border-radius:999px;
    border:1px solid var(--map-line); background:var(--map-panel-2); font-size:12.5px; font-weight:600;
    cursor:pointer; color:var(--map-text-dim); user-select:none; transition: all .15s ease; }
  .chip .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .chip.active{ color:var(--map-text); border-color: currentColor; }
  .chip[data-cat="hotel"].active{ background: rgba(224,168,63,0.14); border-color:var(--gold); }
  .chip[data-cat="transit"].active{ background: rgba(116,144,106,0.14); border-color:var(--sage); }
  .chip[data-cat="safe"].active{ background: rgba(201,96,62,0.14); border-color:var(--terracotta); }
  .chip[data-cat="toilet"].active{ background: rgba(79,102,114,0.2); border-color:var(--dusk); }
  .chip .count{ font-family:'IBM Plex Mono', monospace; color:var(--map-text-dim); font-size:11px; }

  .board-head{ display:flex; justify-content:space-between; align-items:baseline; padding:14px 20px 8px 20px; }
  .board-head h3{ font-family:'Fraunces', serif; font-size:13px; letter-spacing:0.04em; text-transform:uppercase; color:var(--map-text-dim); margin:0; font-weight:600; }
  .board-head span{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--map-text-dim); }
  .board{ flex:1; overflow-y:auto; padding:0 10px 16px 10px; }
  .board::-webkit-scrollbar{ width:6px; }
  .board::-webkit-scrollbar-thumb{ background:var(--map-line); border-radius:3px; }

  .row{ display:grid; grid-template-columns: 4px 34px 1fr auto; align-items:center; gap:12px;
    padding:12px 10px; border-bottom:1px dashed var(--map-line); cursor:pointer; transition: background .12s ease; }
  .row:hover, .row.selected{ background:var(--map-panel-2); border-radius:10px; }
  .row-bar{ align-self:stretch; border-radius:3px; }
  .row-bar.hotel{ background:var(--gold); }
  .row-bar.transit{ background:var(--sage); }
  .row-bar.safe{ background:var(--terracotta); }
  .row-bar.toilet{ background:var(--dusk); }
  .row-icon{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; background:var(--map-panel-2); }
  .row-main{ min-width:0; }
  .row-name{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-sub{ font-size:11.5px; color:var(--map-text-dim); margin-top:2px; }
  .row-dist{ font-family:'IBM Plex Mono', monospace; text-align:right; font-size:13px; font-weight:600; white-space:nowrap; }
  .row-dist small{ display:block; font-size:9.5px; font-weight:400; color:var(--map-text-dim); }

  .empty-state{ padding:40px 20px; text-align:center; color:var(--map-text-dim); font-size:13px; line-height:1.6; }

  #resultsMap{ height:100%; width:100%; background:#0E1C24; }
  .leaflet-popup-content-wrapper{ background:var(--map-panel); color:var(--map-text); border-radius:12px; }
  .leaflet-popup-tip{ background:var(--map-panel); }

  .detail-card{
    position:absolute; right:20px; bottom:20px; z-index:1000;
    width:290px; max-width:calc(100vw - 40px);
    background:var(--map-panel); border:1px solid var(--map-line); border-radius:var(--radius);
    padding:18px; box-shadow: 0 12px 40px rgba(0,0,0,0.45); display:none;
  }
  .detail-card.show{ display:block; }
  .detail-card .cat-tag{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600;
    text-transform:uppercase; letter-spacing:0.05em; color:var(--map-text-dim); margin-bottom:8px; }
  .detail-card h3{ font-size:16px; margin:0 0 6px 0; }
  .detail-card p{ font-size:12.5px; color:var(--map-text-dim); margin:0 0 14px 0; line-height:1.5; }
  .detail-card .btn-primary{ width:100%; border:none; border-radius:10px; background:var(--gold); color:#2B2621;
    font-weight:600; padding:11px 0; cursor:pointer; font-size:13.5px; }
  .detail-card .close{ position:absolute; top:12px; right:14px; cursor:pointer; color:var(--map-text-dim); font-size:16px; background:none; border:none; }

  .leaflet-div-icon{ background:none; border:none; }
  .pin{ width:26px; height:26px; border-radius:50% 50% 50% 0; transform: rotate(-45deg);
    display:flex; align-items:center; justify-content:center; box-shadow: 0 3px 8px rgba(0,0,0,0.4);
    border:2px solid rgba(255,255,255,0.85); }
  .pin span{ transform: rotate(45deg); font-size:12px; }
  .pin.hotel{ background:var(--gold); }
  .pin.transit{ background:var(--sage); }
  .pin.safe{ background:var(--terracotta); }
  .pin.toilet{ background:var(--dusk); }
  .pin.me{ background:#fff; }
</style>
</head>
<body>

<!-- ============================================================
     SPLASH SCREEN
============================================================ -->
<div class="screen active" id="splash">
  <div class="illo-wrap">
    <svg width="180" height="180" viewBox="0 0 180 180" fill="none">
      <g class="sunburst">
        <circle cx="90" cy="90" r="34" fill="#E0A83F"/>
        <g stroke="#C9603E" stroke-width="4" stroke-linecap="round">
          <line x1="90" y1="20" x2="90" y2="38"/>
          <line x1="90" y1="142" x2="90" y2="160"/>
          <line x1="20" y1="90" x2="38" y2="90"/>
          <line x1="142" y1="90" x2="160" y2="90"/>
          <line x1="38" y1="38" x2="50" y2="50"/>
          <line x1="130" y1="130" x2="142" y2="142"/>
          <line x1="142" y1="38" x2="130" y2="50"/>
          <line x1="50" y1="130" x2="38" y2="142"/>
        </g>
      </g>
      <path d="M90 90 q14 -14 0 -28 q-14 14 0 28" stroke="#74906A" stroke-width="0" fill="#74906A" opacity="0.9"/>
      <path d="M40 150 q20 -30 0 -55" stroke="#74906A" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M40 150 q-14 -10 -20 -28" stroke="#74906A" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M40 150 q22 -6 26 -24" stroke="#74906A" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="145" cy="140" r="7" fill="#C9603E"/>
      <circle cx="152" cy="152" r="5" fill="#E0A83F"/>
      <circle cx="132" cy="152" r="5" fill="#74906A"/>
    </svg>
  </div>
  <h1>Smart Travel</h1>
  <p>Plan your trip</p>
</div>

<!-- ============================================================
     SETUP SCREEN — Destination / Arrival / Departure / Transport
============================================================ -->
<div class="screen" id="setup">
  <div class="banner setup-banner">
    <svg width="100%" height="180" viewBox="0 0 480 180" preserveAspectRatio="xMidYMid slice">
      <g class="sunburst" style="transform-origin:80px 70px;">
        <circle cx="80" cy="70" r="30" fill="#E0A83F"/>
        <g stroke="#C9603E" stroke-width="3.5" stroke-linecap="round">
          <line x1="80" y1="14" x2="80" y2="28"/>
          <line x1="80" y1="112" x2="80" y2="126"/>
          <line x1="24" y1="70" x2="38" y2="70"/>
          <line x1="122" y1="70" x2="136" y2="70"/>
          <line x1="40" y1="30" x2="50" y2="40"/>
          <line x1="110" y1="100" x2="120" y2="110"/>
          <line x1="120" y1="30" x2="110" y2="40"/>
          <line x1="50" y1="100" x2="40" y2="110"/>
        </g>
      </g>
      <path d="M400 160 q18 -34 0 -62" stroke="#74906A" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M400 160 q-16 -12 -22 -32" stroke="#74906A" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M400 160 q24 -8 28 -28" stroke="#74906A" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="330" cy="60" r="9" fill="#C9603E"/>
      <circle cx="340" cy="45" r="6" fill="#E0A83F"/>
      <circle cx="318" cy="46" r="6" fill="#74906A"/>
      <path d="M200 150 q30 -20 -8 -46 q30 20 8 46" fill="#E7D5BC" opacity="0.7"/>
      <circle cx="440" cy="130" r="5" fill="#E0A83F" opacity="0.8"/>
      <circle cx="30" cy="140" r="4" fill="#74906A" opacity="0.7"/>
    </svg>
  </div>

  <div class="setup-body">
    <div class="brand-title">
      <h1>Smart Travel</h1>
    </div>

    <label class="field-label first">Destination</label>
    <input class="destination-input" id="destinationInput" type="text" placeholder="Where are you headed? E.g. Madrid, Spain" />

    <label class="field-label">Route</label>
    <div class="route-row">
      <div class="route-field departure">
        <label>Departure</label>
        <input id="departureInput" type="text" placeholder="Origin city" />
      </div>
      <button class="route-swap" id="swapBtn" title="Swap" type="button">⇄</button>
      <div class="route-field">
        <label>Arrival</label>
        <input id="arrivalInput" type="text" placeholder="Arrival city" />
      </div>
    </div>

    <label class="field-label">Transportation</label>
    <div class="transport-list" id="transportList">
      <div class="transport-opt" data-t="bus"><span class="icon">🚌</span><span class="label">Bus</span></div>
      <div class="transport-opt" data-t="train"><span class="icon">🚆</span><span class="label">Train</span></div>
      <div class="transport-opt" data-t="metro"><span class="icon">🚇</span><span class="label">Metro</span></div>
      <div class="transport-opt" data-t="plane"><span class="icon">✈️</span><span class="label">Plane</span></div>
      <div class="transport-opt" data-t="taxi"><span class="icon">🚕</span><span class="label">Taxi / Uber</span></div>
      <div class="transport-opt" data-t="walk"><span class="icon">🚶</span><span class="label">Walk</span></div>
    </div>
  </div>

  <div class="cta-bar">
    <button class="start-btn" id="startTripBtn" disabled>Start Trip</button>
    <div class="hint-text">Enter your destination to get started</div>
  </div>
</div>

<!-- ============================================================
     RESULTS SCREEN — map with nearby hotels/transit/safe/toilets
============================================================ -->
<div class="screen" id="results">
  <div class="results-layout">
    <aside class="results-panel">
      <div class="results-top">
        <button class="back-btn" id="backBtn">←</button>
        <div>
          <h2 id="resultsTitle">Your trip</h2>
          <p id="resultsSubtitle">—</p>
        </div>
      </div>

      <div class="status-line">
        <span class="pulse-dot off" id="statusDot"></span>
        <span id="statusText">Preparing results…</span>
      </div>

      <div class="chips" id="chips">
        <div class="chip active" data-cat="hotel"><span class="dot" style="background:var(--gold)"></span>Lodging <span class="count" id="count-hotel">0</span></div>
        <div class="chip active" data-cat="transit"><span class="dot" style="background:var(--sage)"></span>Transportation <span class="count" id="count-transit">0</span></div>
        <div class="chip active" data-cat="safe"><span class="dot" style="background:var(--terracotta)"></span>Safe stations <span class="count" id="count-safe">0</span></div>
        <div class="chip active" data-cat="toilet"><span class="dot" style="background:var(--dusk)"></span>Restrooms <span class="count" id="count-toilet">0</span></div>
      </div>

      <div class="board-head">
        <h3>Nearest places</h3>
        <span id="resultMeta">—</span>
      </div>
      <div class="board" id="board">
        <div class="empty-state">Loading…</div>
      </div>
    </aside>

    <div style="position:relative;">
      <div id="resultsMap"></div>
      <div class="detail-card" id="detailCard">
        <button class="close" id="closeDetail">✕</button>
        <div class="cat-tag" id="detailTag">—</div>
        <h3 id="detailName">—</h3>
        <p id="detailMeta">—</p>
        <button class="btn-primary" id="directionsBtn">Get directions</button>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  "use strict";

  // ---------- Screen navigation ----------
  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // Splash -> Setup (auto after animation, or tap to skip)
  const splash = document.getElementById('splash');
  let splashDone = false;
  function goToSetup(){
    if(splashDone) return;
    splashDone = true;
    showScreen('setup');
  }
  setTimeout(goToSetup, 2500);
  splash.addEventListener('click', goToSetup);

  // ---------- Setup screen state ----------
  let selectedTransport = null;
  const destinationInput = document.getElementById('destinationInput');
  const departureInput = document.getElementById('departureInput');
  const arrivalInput = document.getElementById('arrivalInput');
  const startBtn = document.getElementById('startTripBtn');
  const hintText = document.querySelector('.hint-text');

  document.getElementById('transportList').addEventListener('click', (e) => {
    const opt = e.target.closest('.transport-opt');
    if(!opt) return;
    document.querySelectorAll('.transport-opt').forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
    selectedTransport = opt.dataset.t;
  });

  document.getElementById('swapBtn').addEventListener('click', () => {
    const tmp = departureInput.value;
    departureInput.value = arrivalInput.value;
    arrivalInput.value = tmp;
  });

  function validateForm(){
    const ok = destinationInput.value.trim().length > 0;
    startBtn.disabled = !ok;
    hintText.textContent = ok ? "All set — start your trip whenever you're ready" : "Enter your destination to get started";
  }
  destinationInput.addEventListener('input', validateForm);

  // ---------- Transport -> category filter mapping ----------
  const TRANSPORT_TO_CAT = {
    bus: "transit", train: "transit", metro: "transit", plane: "transit",
    taxi: null, walk: null
  };

  document.getElementById('startTripBtn').addEventListener('click', () => {
    const dest = destinationInput.value.trim();
    if(!dest) return;
    document.getElementById('resultsSubtitle').textContent =
      (departureInput.value.trim() ? `${departureInput.value.trim()} → ` : "") + dest;
    showScreen('results');
    initMapOnce();
    goSearch(dest);
  });

  document.getElementById('backBtn').addEventListener('click', () => showScreen('setup'));

  // =========================================================
  // RESULTS SCREEN LOGIC (map + overpass, same approach as before)
  // =========================================================
  const CATS = {
    hotel:   { label: "Lodging",       icon: "🛏" },
    transit: { label: "Transportation",icon: "🚉" },
    safe:    { label: "Safe station",  icon: "🛡" },
    toilet:  { label: "Public restroom", icon: "🚻" },
  };
  const activeCats = new Set(Object.keys(CATS));
  let userLatLng = null;
  let map, userMarker, mapInitialized = false;
  let markers = [];
  let results = [];

  function initMapOnce(){
    if(mapInitialized) return;
    mapInitialized = true;
    map = L.map('resultsMap', { zoomControl: true, attributionControl: false }).setView([40.4168, -3.7038], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
    setTimeout(() => map.invalidateSize(), 200);

    document.getElementById('chips').addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if(!chip) return;
      const cat = chip.dataset.cat;
      if(activeCats.has(cat)){ activeCats.delete(cat); chip.classList.remove('active'); }
      else { activeCats.add(cat); chip.classList.add('active'); }
      renderBoard(); renderMarkers();
    });
    document.getElementById('closeDetail').addEventListener('click', () => {
      document.getElementById('detailCard').classList.remove('show');
    });
  }

  function pinIcon(cat, isMe){
    const cls = isMe ? "pin me" : `pin ${cat}`;
    const glyph = isMe ? "" : CATS[cat].icon;
    return L.divIcon({ className:'leaflet-div-icon', html:`<div class="${cls}"><span>${glyph}</span></div>`,
      iconSize:[26,26], iconAnchor:[13,26], popupAnchor:[0,-24] });
  }
  function haversine(lat1, lon1, lat2, lon2){
    const R = 6371000, toRad = d => d*Math.PI/180;
    const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
    return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }
  function fmtDist(m){ return m < 1000 ? {val:Math.round(m), unit:"m"} : {val:(m/1000).toFixed(1), unit:"km"}; }
  function walkMinutes(m){ return Math.max(1, Math.round(m/80)); }
  function setStatus(text, live){
    document.getElementById('statusText').textContent = text;
    document.getElementById('statusDot').classList.toggle('off', !live);
  }
  function escapeHtml(str){ return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  async function goSearch(query){
    setStatus("Searching destination…", true);
    try{
      const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`);
      const data = await resp.json();
      if(data.length === 0){ setStatus("That destination wasn't found.", false); return; }
      const lat = parseFloat(data[0].lat), lng = parseFloat(data[0].lon);
      userLatLng = { lat, lng };
      if(userMarker) map.removeLayer(userMarker);
      userMarker = L.marker([lat, lng], { icon: pinIcon(null, true) }).addTo(map);
      map.setView([lat, lng], 15);
      fetchNearby(lat, lng);
    }catch(err){
      console.error(err);
      setStatus("Error searching for destination.", false);
    }
  }

  async function fetchNearby(lat, lng){
    setStatus("Searching nearby places…", true);
    document.getElementById('board').innerHTML = `<div class="empty-state">Checking the map…</div>`;
    const radius = 1500;
    const query = `
      [out:json][timeout:25];
      (
        node["tourism"~"hotel|guest_house|hostel"](around:${radius},${lat},${lng});
        node["public_transport"="station"](around:${radius},${lat},${lng});
        node["railway"~"station|subway_entrance|tram_stop"](around:${radius},${lat},${lng});
        node["highway"="bus_stop"](around:${radius},${lat},${lng});
        node["amenity"="police"](around:${radius},${lat},${lng});
        node["amenity"="hospital"](around:${radius},${lat},${lng});
        node["amenity"="toilets"](around:${radius},${lat},${lng});
      );
      out body;
    `;
    try{
      const resp = await fetch("https://overpass-api.de/api/interpreter", { method:"POST", body:"data="+encodeURIComponent(query) });
      if(!resp.ok) throw new Error("overpass_error");
      const data = await resp.json();
      processResults(data.elements || [], lat, lng);
    }catch(err){
      console.error(err);
      setStatus("Couldn't load the map right now.", false);
      document.getElementById('board').innerHTML = `<div class="empty-state">We couldn't load nearby places. Check your connection and try again.</div>`;
    }
  }

  function classify(tags){
    if(!tags) return null;
    if(tags.tourism && /hotel|guest_house|hostel/.test(tags.tourism)) return "hotel";
    if(tags.public_transport === "station") return "transit";
    if(tags.railway && /station|subway_entrance|tram_stop/.test(tags.railway)) return "transit";
    if(tags.highway === "bus_stop") return "transit";
    if(tags.amenity === "police" || tags.amenity === "hospital") return "safe";
    if(tags.amenity === "toilets") return "toilet";
    return null;
  }

  function processResults(elements, lat, lng){
    results = [];
    elements.forEach(el => {
      const cat = classify(el.tags);
      if(!cat) return;
      const name = el.tags.name || (cat==="safe" && el.tags.amenity==="hospital" ? "Hospital" : cat==="safe" ? "Police station" : cat==="toilet" ? "Public restroom" : cat==="transit" ? "Transit stop / station" : "Lodging");
      const dist = haversine(lat, lng, el.lat, el.lon);
      results.push({ id: el.id, cat, name, lat: el.lat, lng: el.lon, dist,
        opening_hours: el.tags.opening_hours || null,
        address: [el.tags["addr:street"], el.tags["addr:housenumber"]].filter(Boolean).join(" ") || null });
    });
    results.sort((a,b)=>a.dist-b.dist);
    setStatus(`${results.length} places found`, true);
    renderCounts(); renderBoard(); renderMarkers();
  }

  function renderCounts(){
    Object.keys(CATS).forEach(cat => {
      document.getElementById(`count-${cat}`).textContent = results.filter(r=>r.cat===cat).length;
    });
  }

  function renderBoard(){
    const board = document.getElementById('board');
    const visible = results.filter(r => activeCats.has(r.cat));
    document.getElementById('resultMeta').textContent = `${visible.length} de ${results.length}`;
    if(visible.length === 0){
      board.innerHTML = `<div class="empty-state">No results for the selected categories within 1.5 km.</div>`;
      return;
    }
    board.innerHTML = visible.map(r => {
      const d = fmtDist(r.dist);
      return `<div class="row" data-id="${r.id}">
        <div class="row-bar ${r.cat}"></div>
        <div class="row-icon">${CATS[r.cat].icon}</div>
        <div class="row-main">
          <div class="row-name">${escapeHtml(r.name)}</div>
          <div class="row-sub">${CATS[r.cat].label} · ${walkMinutes(r.dist)} min walk</div>
        </div>
        <div class="row-dist">${d.val}<small>${d.unit}</small></div>
      </div>`;
    }).join("");
    board.querySelectorAll('.row').forEach(row => {
      row.addEventListener('click', () => {
        const item = results.find(r => r.id === Number(row.dataset.id));
        if(item) selectItem(item);
      });
    });
  }

  function renderMarkers(){
    markers.forEach(m => map.removeLayer(m.layer));
    markers = [];
    results.forEach(r => {
      if(!activeCats.has(r.cat)) return;
      const layer = L.marker([r.lat, r.lng], { icon: pinIcon(r.cat) }).addTo(map);
      layer.on('click', () => selectItem(r));
      markers.push({ layer, item: r });
    });
  }

  function selectItem(item){
    document.querySelectorAll('.row').forEach(row => row.classList.toggle('selected', Number(row.dataset.id) === item.id));
    map.panTo([item.lat, item.lng]);
    const card = document.getElementById('detailCard');
    document.getElementById('detailTag').textContent = CATS[item.cat].label;
    document.getElementById('detailName').textContent = item.name;
    const d = fmtDist(item.dist);
    const bits = [`${d.val}${d.unit} · ${walkMinutes(item.dist)} min walk`];
    if(item.address) bits.push(item.address);
    if(item.opening_hours) bits.push(`Hours: ${item.opening_hours}`);
    document.getElementById('detailMeta').textContent = bits.join(" · ");
    card.classList.add('show');
    document.getElementById('directionsBtn').onclick = () => {
      const origin = userLatLng ? `${userLatLng.lat},${userLatLng.lng}` : "";
      window.open(`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${item.lat},${item.lng}`, "_blank");
    };
  }

})();
</script>
</body>
